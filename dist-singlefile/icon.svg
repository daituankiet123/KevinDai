<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="50%" stop-color="#ffe4e6" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#e11d48" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded rect with safe zone for maskable icons -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer subtle circular ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#fda4af" stroke-width="6" opacity="0.6" stroke-dasharray="12 8" />

  <!-- Big Glowing Heart -->
  <path
    d="M256 420 C256 420 80 300 80 180 C80 115 130 75 195 75 C230 75 250 95 256 105 C262 95 282 75 317 75 C382 75 432 115 432 180 C432 300 256 420 256 420 Z"
    fill="url(#heartGrad)"
    filter="url(#shadow)"
  />

  <!-- Inner Golden Star (Military honor & waiting for soldier) -->
  <polygon
    points="256,135 272,185 325,185 282,216 298,266 256,235 214,266 230,216 187,185 240,185"
    fill="url(#goldGrad)"
  />

  <!-- Couple Ribbon / Text Motif -->
  <path d="M160 320 Q256 360 352 320" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.9" />

  <!-- Small sparkling stars -->
  <circle cx="140" cy="140" r="10" fill="#ffffff" opacity="0.8" />
  <circle cx="370" cy="140" r="10" fill="#ffffff" opacity="0.8" />
  <circle cx="256" cy="385" r="8" fill="#ffffff" opacity="0.9" />
</svg>
