<!-- Thay/ghép vào <head> của index.html -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14161f" />

<!-- Chạy toàn màn hình khi mở từ Màn hình chính -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Chờ Anh Về" />
<!-- black-translucent: nội dung tràn xuống dưới status bar, dùng pt-safe để chừa chỗ -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<!-- Icon PNG 180x180, nền đặc (iOS không hỗ trợ nền trong suốt) -->
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<!-- Font: để chạy offline, tự host bằng @fontsource (xem ios.css), không dùng Google Fonts -->
